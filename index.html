<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KeyLink360</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />

    <style>
      /* Hide Google Translate top banner, tooltips & iframe overlays permanently */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      iframe[class*="goog-te-banner"],
      iframe[id*=":1.container"],
      iframe[id*=":2.container"],
      iframe[src*="translate.google.com"],
      .skiptranslate iframe,
      #goog-gt-tt,
      #goog-gt-vt,
      .goog-te-balloon-frame,
      .goog-te-spinner-pos,
      .goog-tooltip,
      .goog-tooltip:hover,
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
      .VIpgJd-ZVi9od-aZ2wEe-OiiCO,
      .VIpgJd-yAWNEb-hvhgNd,
      .VIpgJd-ZVi9od-l4eHX-hSRGPd,
      .VIpgJd-ZVi9od-SmfZ-OueMb,
      [class*="VIpgJd-ZVi9od-"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        height: 0 !important;
        width: 0 !important;
        max-height: 0 !important;
        max-width: 0 !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        z-index: -9999 !important;
      }

      html,
      body {
        top: 0px !important;
        position: static !important;
        margin-top: 0px !important;
        transform: none !important;
      }

      .goog-text-highlight {
        background: transparent !important;
        box-shadow: none !important;
        color: inherit !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element" style="display:none !important; position: absolute; top: -9999px; left: -9999px;"></div>
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        try {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            autoDisplay: false
          }, 'google_translate_element');
        } catch (e) {
          // ignore
        }
      };

      // Continuous suppression of Google Translate top banner & body top offset
      (function() {
        function resetBodyTop() {
          if (document.body) {
            if (document.body.style.top && document.body.style.top !== '0px') {
              document.body.style.top = '0px';
            }
            if (document.body.style.position && document.body.style.position !== 'static') {
              document.body.style.position = 'static';
            }
          }
          if (document.documentElement) {
            if (document.documentElement.style.top && document.documentElement.style.top !== '0px') {
              document.documentElement.style.top = '0px';
            }
          }
          var frames = document.querySelectorAll('.goog-te-banner-frame, iframe[id*=":1.container"], iframe[id*=":2.container"], iframe[class*="goog-te-banner"], [class*="VIpgJd-ZVi9od-"]');
          for (var i = 0; i < frames.length; i++) {
            frames[i].style.display = 'none';
            frames[i].style.visibility = 'hidden';
            frames[i].style.height = '0px';
          }
        }

        if (window.MutationObserver) {
          var observer = new MutationObserver(function() {
            resetBodyTop();
          });
          observer.observe(document.documentElement, {
            attributes: true,
            childList: true,
            subtree: true,
            attributeFilter: ['style', 'class']
          });
        }
        setInterval(resetBodyTop, 200);
      })();
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
